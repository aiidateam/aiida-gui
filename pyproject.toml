[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aiida-gui"
dynamic = ["version"]  # read from aiida_gui/__init__.py
description = "Design flexible node-based workflow for AiiDA calculation."
authors = [{name = "Xing Wang", email = "xingwang1991@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: AiiDA",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering"
]
keywords = ["aiida", "workflows"]
requires-python = ">=3.10"
dependencies = [
    "aiida-core>=2.8,<3",
    "fastapi",
    "uvicorn",
    "pydantic_settings",
    "weas_widget",
]

[project.urls]
Documentation = "https://aiida-gui.readthedocs.io"
Source = "https://github.com/aiidateam/aiida-gui"

[project.optional-dependencies]
docs = [
    "sphinx_rtd_theme",
    "sphinx~=7.2",
    "sphinx-copybutton~=0.5.0",
    "sphinx-design~=0.5.0",
    "sphinx-notfound-page~=1.0",
    "sphinxext-rediraffe~=0.2.4",
    "sphinx-intl~=2.1.0",
    "sphinx-gallery",
    "myst-nb~=1.0.0",
    "nbsphinx",
]
pre-commit = [
    'pre-commit~=3.5',
]
tests = [
    'pgtest~=1.3',
    "pytest~=7.0",
    "pytest-cov~=2.7,<2.11",
    "pytest-playwright",
    "httpx",
]

[project.scripts]
aiida-gui = "aiida_gui.cmd_web:cli"

[tool.flit.sdist]
exclude = [
    "docs/",
    "tests/",
    "frontend/node_modules/",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
ignore = [
  'F403',  # Star imports unable to detect undefined names
  'F405',  # Import may be undefined or defined from star imports
  'PLC0415',  # import-outside-top-level
  'PLR0911',  # Too many return statements
  'PLR0912',  # Too many branches
  'PLR0913',  # Too many arguments in function definition
  'PLR0915',  # Too many statements
  'PLR2004',  # Magic value used in comparison
  'PLW1641',  # Checks for classes that implement `__eq__` but not `__hash__`
  'RUF005',  # Consider iterable unpacking instead of concatenation
  'RUF012',  # Mutable class attributes should be annotated with `typing.ClassVar`
  'RUF043',  # Pattern passed to `match=` contains metacharacters but is neither escaped nor raw
  'RUF059'  # Unpacked variable is never used
]
select = [
  'E',  # pydocstyle
  'W',  # pydocstyle
  'F',  # pyflakes
  'UP',  # pyupgrade
  'I',  # isort
  'N',  # pep8-naming
  'PLC',  # pylint-convention
  'PLE',  # pylint-error
  'PLR',  # pylint-refactor
  'PLW',  # pylint-warning
  'RUF',  # ruff
  'FLY',  # flynt
  'NPY201'  # numpy compatibility
]

[tool.pytest.ini_options]
markers =[
    "backend: backend integration tests using the AiiDA test profile",
    "frontend: browser-based frontend integration tests using Playwright"
]
filterwarnings =[
    "ignore:.*Creating AiiDA configuration folder.*"
]
